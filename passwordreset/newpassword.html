<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sicher-Hei+ Passwort zurücksetzen</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style_unverified.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
  
<body>
      <div id="welcome_empty">
      </div>

  <div class="title_container">
    <h2>Passwort vergessen?<br>Das kann passieren.</h2>
    <p>Setzen Sie hier Ihr Passwort zurück.</p>
  </div>

  <form id="resetForm">
    <input type="password" id="password" placeholder="Passwort wählen" required>
    </div>
    <div>
      <input type="password" id="password_repeat" placeholder="Passwort wiederholen" required>
    </div>
      <button type="submit">Passwort zurücksetzen &#10132;</button>
    </form>

    <script src="newpassword.js"></script>
  </body>
</html>
